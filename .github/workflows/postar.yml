name: Postar vagas linkedin

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar libs
        run: |
          pip install -r postar/requirements.txt
          playwright install --with-deps

      - name: Criar sessão LinkedIn
        run: |
          cat <<EOF > linkedin_session.json
          ${{ secrets.LINKEDIN_SESSION }}
          EOF

      - name: Rodar script
        run: python postar_vagas.py

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug_screenshot.png
