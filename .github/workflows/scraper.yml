name: Atualizar vagas automaticamente

on:
  schedule:
    - cron: "0 11 * * *" # 08:00 BR (UTC+3)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    env:
      VAGAS_EMAIL: ${{ secrets.VAGAS_EMAIL }}
      VAGAS_SENHA: ${{ secrets.VAGAS_SENHA }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium

      - name: Rodar scraper
        run: python scraper/scraper.py

      - name: Commit e push se houver mudanças
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add vagas.csv
          git diff --cached --quiet || git commit -m "auto: atualiza vagas"
          git push
