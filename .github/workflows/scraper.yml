name: Atualizar vagas automaticamente

on:
  schedule:
    - cron: "0 17 * * *" # 14:00 BR → (UTC-3) 
    - cron: "0 20 * * *" # 17:00 BR → (UTC-3)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    env:                       
      EMAIL_USER_CENTRAL: ${{ secrets.EMAIL_USER_CENTRAL }}
      EMAIL_PASS_CENTRAL: ${{ secrets.EMAIL_PASS_CENTRAL }}
      GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium

      - name: Rodar scraper
        run: python scraper/scraper.py

      - name: Commit e push se houver mudanças
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add vagas.csv vagas_novas.csv vagas_debug.csv

          if git diff --cached --quiet; then
            echo "✅ Nenhuma mudança para commitar"
          else
            git commit -m "auto: atualiza vagas"

            for i in 1 2 3; do
              echo "🚀 Tentativa $i de push..."

              if git pull --rebase origin main && git push; then
                echo "✅ Push realizado com sucesso"
                break
              fi

              echo "⚠️ Falha na tentativa $i, tentando novamente..."
              sleep 5
            done
          fi
