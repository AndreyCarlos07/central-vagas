name: Atualizar vagas automaticamente

on:
  schedule:
    - cron: "0 15 * * *" # 12:00 BR → PRO manhã
    - cron: "0 20 * * *" # 17:00 BR → PRO tarde
    - cron: "0 23 * * *" # 20:00 BR → FREE
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de execução (pro ou free)"
        required: true
        default: "pro"

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    env:                       
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium

      # ===========================
      # EXECUÇÃO PRO (12h e 17h)
      # ===========================
      - name: Rodar scraper (PRO)
        if: |
          github.event.schedule == '0 15 * * *' ||
          github.event.schedule == '0 20 * * *' ||
          github.event.inputs.modo == 'pro'
        run: |
          echo "🚀 EXECUTANDO MODO PRO"

          python scraper/scraper.py

          cp vagas.csv vagas_pro.csv

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add vagas_pro.csv vagas_novas.csv vagas_debug.csv

          if git diff --cached --quiet; then
            echo "✅ Nenhuma mudança PRO"
          else
            git commit -m "auto: atualiza vagas PRO"
            git pull --rebase origin main
            git push
          fi

      # ===========================
      # EXECUÇÃO FREE (20h)
      # ===========================
      - name: Liberar vagas para FREE
        if: |
          github.event.schedule == '0 23 * * *' ||
          github.event.inputs.modo == 'free'
        run: |
          echo "🌐 LIBERANDO PARA FREE"

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add vagas.csv

          if git diff --cached --quiet; then
            echo "✅ Nenhuma mudança FREE"
          else
            git commit -m "auto: libera vagas FREE"
            git pull --rebase origin main
            git push
          fi
