name: Atualizar vagas automaticamente

on:
  schedule:
    - cron: "0 20 * * *" # 17:00 BR (UTC-3)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    env:                       
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r scraper/requirements.txt
          playwright install chromium

      - name: Rodar scraper
        run: python scraper/scraper.py

      - name: Commit e push se houver mudanças
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add vagas.csv vagas_novas.csv vagas_debug.csv
          git diff --cached --quiet || git commit -m "auto: atualiza vagas"
          git push
